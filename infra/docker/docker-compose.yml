services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: betto
      POSTGRES_USER: betto
      POSTGRES_PASSWORD: betto
    ports:
      - "5432:5432"
    volumes:
      - betto-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: betto
      MINIO_ROOT_PASSWORD: betto-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - betto-minio:/data

volumes:
  betto-postgres:
  betto-minio:

